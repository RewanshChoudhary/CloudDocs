<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Security Test</title>
</head>
<body>
<h1>Security Test Page</h1>
<p th:text="'Server Time: ' + ${#dates.createNow()}">Server Time</p>

<hr>
<h2>Quick Checks</h2>

<form method="post" th:action="@{/login}" th:if="${#authorization == null}">
  <fieldset>
    <legend>Login Test</legend>
    <input type="text" name="username" placeholder="username" required>
    <input type="password" name="password" placeholder="password" required>
    <button type="submit">Login</button>
  </fieldset>
</form>

<div th:if="${#authorization != null}">
  <p>Authenticated as: <span th:text="${#authentication.name}">user</span></p>
  <p>Roles: <span th:text="${#authentication.authorities}">[]</span></p>
</div>

<hr>
<h2>CSRF Token</h2>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<p th:if="${_csrf} != null" th:text="'CSRF token present: ' + ${_csrf.token}">token</p>
<p th:unless="${_csrf} != null">CSRF token not found (check Thymeleaf config)</p>
</body>
</html>
