spring:
  application:
    name: CloudDocs

  datasource:
    url: jdbc:postgresql://localhost:5432/clouddocs
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    locations: classpath:sql
    enabled: true