spring:
  application:
    name: CloudDocs

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clouddocs}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    locations: classpath:sql
    enabled: true

media:
  aws:
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${MEDIA_S3_BUCKET:}
    queue-url: ${MEDIA_SQS_QUEUE_URL:}

jwt:
  secret: ${JWT_SECRET:Zm9vYmFyYmF6cXV4ZXhhbXBsZXNlY3JldGZvcmp3dHNpZ25pbmc=}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:}
  api_key: ${CLOUDINARY_API_KEY:}
  api_secret: ${CLOUDINARY_API_SECRET:}
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${MEDIA_S3_BUCKET:clouddocs-media-local}
    endpoint: ${AWS_S3_ENDPOINT:}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
